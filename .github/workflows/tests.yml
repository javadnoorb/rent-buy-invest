name: Tests
# Runs on every push and pull request: model math tests, a rebuild check, and a browser smoke test.
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Model tests
        run: node tests/run.js
      - name: index.html is up to date with src/ and data/
        run: |
          python3 build.py --pwa
          git diff --exit-code index.html || (echo "index.html is stale: run python3 build.py --pwa and commit" && exit 1)
      - name: Browser smoke test
        run: |
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          node tests/smoke.js
