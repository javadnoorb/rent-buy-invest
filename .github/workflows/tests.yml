name: Tests
# Runs on every push and pull request. Two jobs in parallel:
#   checks — static lint, type check, model math tests, data-script parser tests and the build (seconds)
#   smoke  — the built page in the runner's preinstalled Chrome with the real chart and formula libraries: UI logic tests,
#            an axe-core accessibility check, chart layout (labels overlapping or clipped at four widths) and the
#            trace check (every chart point's equations reproduce the model and the plotted value)
on: [push, pull_request]
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Lint
        run: node tests/lint.js
      - name: Type check (TypeScript over the plain JavaScript; tsconfig.json)
        run: |
          npm i --no-save --no-audit --no-fund typescript@5.6.3
          npx tsc -p .
      - name: Model tests
        run: node tests/run.js
      - name: Check against a published study (Beracha & Johnson 2012)
        run: node tests/validate.js
      - name: Data script parsers (offline samples)
        run: python3 tests/test_scripts.py
      - name: Build
        run: python3 build.py --pwa
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Build
        run: python3 build.py --pwa
      - name: Browser smoke test (phone width, touch, formulas)
        env:
          PLAYWRIGHT_PATH: playwright-core
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm i --no-save --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.2
          node tests/smoke.js
      - name: UI logic tests (headline, ties, undo, counties, chart descriptions)
        env:
          PLAYWRIGHT_PATH: playwright-core
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/ui.js
      - name: Accessibility (axe-core, WCAG 2.1 AA)
        env:
          PLAYWRIGHT_PATH: playwright-core
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/a11y.js
      - name: Chart layout (overlapping or clipped labels at 390, 600, 900 and 1280px)
        env:
          PLAYWRIGHT_PATH: playwright-core
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          for _ in $(seq 50); do curl -sf -o /dev/null http://127.0.0.1:8765/index.html && break; sleep 0.2; done
          node tests/layout.js
      - name: Trace (each chart point's equations reproduce the model and the plotted value)
        env:
          PLAYWRIGHT_PATH: playwright-core
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/trace.js
