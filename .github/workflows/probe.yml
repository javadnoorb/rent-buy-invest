name: probe
on:
  push:
    branches: [ccr-cc45a5a9-cgrtuy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Beracha & Johnson (2012) text
        run: |
          pip -q install pypdf
          curl -sSL -m 60 -A "Mozilla/5.0" -o b.pdf https://gwern.net/doc/economics/georgism/2012-beracha.pdf; ls -l b.pdf
          python - <<'PY'
          from pypdf import PdfReader
          r=PdfReader('b.pdf')
          for i,p in enumerate(r.pages):
              print(f'=== PAGE {i+1} ==='); print(p.extract_text())
          PY
