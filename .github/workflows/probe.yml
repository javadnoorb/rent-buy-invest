name: probe
on:
  push:
    branches: [ccr-cc45a5a9-cgrtuy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Parallel FEMA flood fetch (forced), timed
        run: |
          start=$(date +%s)
          python scripts/fetch_flood.py /tmp/flood.json --force
          echo "elapsed: $(( $(date +%s) - start )) s"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/flood.json'))
          print('counties with penetration:',len(d['pen']),'county costs:',len(d['cost']),'state costs:',len(d['state_cost']))
          print('Miami-Dade 12086:',d['pen'].get('12086'),d['cost'].get('12086'),'FL state:',d['state_cost'].get('12'))
          PY
