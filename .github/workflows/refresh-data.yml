name: Refresh data
# Runs every Friday (Freddie Mac publishes mortgage rates on Thursdays) and on demand (Actions tab → Refresh data → Run workflow).
# Downloads public data (Treasury yields, CPI, Zillow typical value and rent, FHFA incl. county indexes, BLS, Census incl. county figures, HUD Fair Market Rents, Freddie Mac,
# Philadelphia Fed forecasts, Census mover rates, BLS renters insurance), merges it into data/ and rebuilds
# index.html for the tests. Then scripts/check_data.py compares the new data with main and stops the run on anything implausible
# (lost months, large revisions, jumps in rates or prices, a short county file), and the tests run. Only if both pass
# and something changed are the data files committed to main; the Deploy site workflow then rebuilds the live page.
# A failed run opens (or comments on) one GitHub issue labelled data-refresh, so it shows up in your notifications; the next
# successful run closes it.
on:
  schedule:
    - cron: '23 14 * * 5'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }  # full history, so a main that moved during the run can be merged
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Fetch
        run: |
          python scripts/fetch_fhfa.py /tmp/fhfa_extract.json
          python scripts/fetch_market.py || echo "::warning::Treasury/CPI/Zillow fetch failed; keeping the existing data/market.json"
          python scripts/fetch_public.py /tmp/public_extract.json
          python scripts/fetch_counties.py || echo "::warning::county fetch failed; keeping the existing data/counties.json"
          python scripts/fetch_fmr.py || echo "::warning::HUD Fair Market Rent fetch failed; keeping the existing data/county_fmr.json"
          python scripts/fetch_county_hpi.py || echo "::warning::FHFA county index fetch failed; keeping the existing data/county_hpi/"
          python scripts/fetch_zips.py || echo "::warning::ZIP code fetch failed; keeping the existing data/zip/"
          python scripts/fetch_insurance.py || echo "::warning::insurance fetch failed; keeping the existing data/insurance.json"
          python scripts/fetch_county_metro.py || echo "::warning::county-to-metro fetch failed; keeping the existing data/county_metro.json"
          python scripts/fetch_flood.py || echo "::warning::FEMA flood fetch failed; keeping the existing data/flood.json"
          python scripts/fetch_rent_price.py || echo "::warning::rent-to-price fetch failed; keeping the existing data/rent_price.json"
          python scripts/fetch_forecasts.py || echo "::warning::forecast/mover/renters-insurance fetch failed; keeping the existing data/forecasts_public.json"
      - name: Merge and rebuild
        run: |
          python scripts/apply_public.py /tmp/public_extract.json /tmp/fhfa_extract.json
          python prep_monthly.py
          python build.py --pwa
      - name: Sanity-check the new data against main
        env: { STALE_OUT: /tmp/stale.txt }
        run: python scripts/check_data.py
      - name: Test
        run: |
          node tests/lint.js
          node tests/run.js
          python3 tests/test_scripts.py
          npm i --no-save --no-audit --no-fund playwright-core@1.47.2
          PLAYWRIGHT_PATH=playwright-core CHROME_PATH=/usr/bin/google-chrome node tests/smoke.js
          PLAYWRIGHT_PATH=playwright-core CHROME_PATH=/usr/bin/google-chrome node tests/ui.js
      - name: Commit to main if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          python3 scripts/only_fetch_times.py
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git diff --cached --stat
          git commit -m "Refresh public data $(date -u +%F)"
          # if main moved during the run (a code push), merge it and push again: the refresh only touches data/.
          # A merge conflict means main changed the same data files; then stop and let the next run start fresh.
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "main moved during the run; merging it (attempt $i)"
            git fetch origin main
            git merge --no-edit origin/main || { git merge --abort; echo "::error::main changed the same data files during the run; run Refresh data again"; exit 1; }
          done
          echo "::error::could not push to main after 3 attempts"; exit 1
      - name: Report stale sources as an issue
        # a source that keeps failing leaves its old data in place; when its newest date is too old, say so in one issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --label data-stale --state open --json number --jq '.[0].number' || true)
          if [ -s /tmp/stale.txt ]; then
            gh label create data-stale --color fbca04 --description "A data source has not updated" 2>/dev/null || true
            body="These sources have not updated for longer than expected (their download or format may have changed). The site keeps showing their last data. Look for warnings in the Fetch step of $RUN

          $(cat /tmp/stale.txt)

          This issue closes itself once all sources are current."
            if [ -n "$n" ]; then gh issue edit "$n" --body "$body"; else gh issue create --title "Data source not updating" --label data-stale --body "$body"; fi
          elif [ -n "$n" ]; then gh issue close "$n" --comment "All sources are current again: $RUN"; fi
      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create data-refresh --color d93f0b --description "Weekly data refresh failed" 2>/dev/null || true
          body="The weekly data refresh failed on $(date -u +%F): $RUN
          The live site keeps the previous data. Open the run, find the red step, and fix or re-run it (Actions → Refresh data → Run workflow). This issue closes itself after the next successful run."
          n=$(gh issue list --label data-refresh --state open --json number --jq '.[0].number' || true)
          if [ -n "$n" ]; then gh issue comment "$n" --body "Failed again: $RUN"; else gh issue create --title "Data refresh failed" --label data-refresh --body "$body"; fi
      - name: Close the failure issue after a successful run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label data-refresh --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Fixed: this run succeeded: $RUN"
          done
