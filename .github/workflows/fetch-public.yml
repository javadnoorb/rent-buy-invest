name: Fetch public data (BLS, Census, Freddie Mac)
# Runs only when started by hand (Actions tab → Run workflow) or when the fetch script or its config changes. No schedule.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch_public.py', 'scripts/public_series.json', '.github/workflows/fetch-public.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python scripts/fetch_public.py public_extract.json
      - name: Save extract to the data-public branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-public
          git rm -rq --cached .
          git add public_extract.json
          git commit -m "Public data extract $(date -u +%F)"
          git push -f origin data-public
